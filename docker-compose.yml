services:
  postgres:
    image: postgres:16
    container_name: pluto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pluto}
      POSTGRES_USER: ${POSTGRES_USER:-pluto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pluto_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - pluto_postgres_data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pluto} -d ${POSTGRES_DB:-pluto}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pluto-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-pluto}:${POSTGRES_PASSWORD:-pluto_dev_password}@postgres:5432/${POSTGRES_DB:-pluto}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pluto_postgres_data:
