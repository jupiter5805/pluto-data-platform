services:
  airflow-init:
    image: apache/airflow:2.10.5
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --no-cache-dir pandas pyarrow openpyxl psycopg2-binary dbt-postgres &&
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Pluto \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - airflow_data:/opt/airflow
      - ./:/opt/airflow/pluto

  airflow-webserver:
    image: apache/airflow:2.10.5
    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir pandas pyarrow openpyxl psycopg2-binary dbt-postgres &&
        airflow webserver
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-pluto}
      POSTGRES_USER: ${POSTGRES_USER:-pluto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pluto_dev_password}
    ports:
      - "8080:8080"
    volumes:
      - airflow_data:/opt/airflow
      - ./:/opt/airflow/pluto
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-scheduler:
    image: apache/airflow:2.10.5
    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir pandas pyarrow openpyxl psycopg2-binary dbt-postgres &&
        airflow scheduler
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-pluto}
      POSTGRES_USER: ${POSTGRES_USER:-pluto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pluto_dev_password}
    volumes:
      - airflow_data:/opt/airflow
      - ./:/opt/airflow/pluto
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  airflow_data:
