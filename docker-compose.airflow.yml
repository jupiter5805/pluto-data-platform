services:
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: pluto-airflow
    command: standalone
    restart: unless-stopped
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-pluto}
      POSTGRES_USER: ${POSTGRES_USER:-pluto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pluto_dev_password}
      DBT_PROFILES_DIR: /opt/pluto/analytics_dbt
      PYTHONPATH: /opt/pluto
    ports:
      - "8080:8080"
    volumes:
      - airflow_data:/opt/airflow
      - ./:/opt/pluto
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  airflow_data:
